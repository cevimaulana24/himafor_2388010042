name: Deploy Docker Compose to AWS EC2

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web statis image
        uses: docker/build-push-action@v6
        with:
          context: ./web-statis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/himafor_2388010042:latest

      - name: Build and push web dinamis image
        uses: docker/build-push-action@v6
        with:
          context: ./web-dinamis
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml,web-dinamis/sql/schema.sql"
          target: "~/himafor_2388010042"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/himafor_2388010042

            NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
            if [ -z "$NEXTAUTH_SECRET" ]; then
              NEXTAUTH_SECRET="secret123"
            fi

            MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
            if [ -z "$MYSQL_ROOT_PASSWORD" ]; then
              MYSQL_ROOT_PASSWORD="rootpassword"
            fi

            cat > .env <<EOF
            STATIC_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/himafor_2388010042:latest
            DYNAMIC_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest
            AWS_HOST=${{ secrets.AWS_HOST }}
            NEXTAUTH_SECRET=$NEXTAUTH_SECRET
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -f
